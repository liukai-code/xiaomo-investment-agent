<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 680px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message .label {
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }

    .message.user .label { text-align: right; }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: #f0f2f5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .chat-input {
      padding: 16px 24px;
      border-top: 1px solid #e8e8e8;
      display: flex;
      gap: 12px;
      background: #fff;
    }

    .chat-input textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 120px;
      min-height: 44px;
    }

    .chat-input textarea:focus {
      border-color: #667eea;
    }

    .chat-input button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .chat-input button:hover { opacity: 0.9; }
    .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .error-hint {
      font-size: 13px;
      color: #ef4444;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span class="dot"></span>
    AI Chat
  </div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function addMessage(text, role) {
    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;
    wrapper.innerHTML = `
      <div>
        <div class="label">${role === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble"></div>
      </div>
    `;
    wrapper.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    let el = document.getElementById('typing');
    if (!el) {
      el = document.createElement('div');
      el.id = 'typing';
      el.className = 'typing-indicator';
      el.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(el);
    }
    el.style.display = 'block';
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    const aiMessage = addMessage('', 'ai');
    const bubble = aiMessage.querySelector('.bubble');

    try {
      const url = `/agent/chat/stream?message=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          if (part.startsWith('data:')) {
            const chunk = part.substring(5).trimStart();
            if (chunk) {
              bubble.textContent += chunk;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        }
      }

      if (buffer.startsWith('data:')) {
        const chunk = buffer.substring(5).trimStart();
        if (chunk) bubble.textContent += chunk;
      }

      if (!bubble.textContent) bubble.textContent = '(empty response)';

    } catch (err) {
      bubble.textContent = '网络错误: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
