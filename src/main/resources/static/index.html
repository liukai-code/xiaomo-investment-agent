<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #111114;
      --surface-2: #18181c;
      --border: #222228;
      --text: #c8c8d0;
      --text-dim: #5a5a6a;
      --accent: #00e676;
      --accent-dim: #00e67620;
      --user-bg: #1a1a22;
      --danger: #ff5252;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    .chat-container {
      width: 720px;
      height: 92vh;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .chat-header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .chat-header .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-header .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }

    .chat-header .status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; }
    .message.ai { align-self: flex-start; }

    .message .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .message.user .label {
      color: var(--accent);
      text-align: right;
    }

    .message.ai .label {
      color: var(--text-dim);
    }

    .message .bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
      color: var(--text);
    }

    .message.ai .bubble {
      background: transparent;
      border-left: 2px solid var(--accent);
      border-radius: 0;
      color: var(--text);
      padding-left: 16px;
    }

    .cursor-blink {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .chat-input {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .chat-input textarea {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      transition: border-color 0.2s;
    }

    .chat-input textarea::placeholder {
      color: var(--text-dim);
      font-size: 13px;
    }

    .chat-input textarea:focus {
      border-color: var(--accent);
    }

    .chat-input button {
      padding: 12px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chat-input button:hover {
      background: #33eb91;
      box-shadow: 0 0 16px var(--accent-dim);
    }

    .chat-input button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      user-select: none;
    }

    .welcome .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .welcome .sub {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .welcome .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 24px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .welcome .hint kbd {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      font-size: 11px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="left">
      <span class="dot"></span>
      <span class="title">Terminal</span>
    </div>
    <span class="status" id="status">READY</span>
  </div>
  <div class="chat-messages" id="messages">
    <div class="welcome">
      <div class="logo">> _</div>
      <div class="sub">AI Terminal v1.0</div>
      <div class="hint"><kbd>Enter</kbd> 发送 &nbsp; <kbd>Shift+Enter</kbd> 换行</div>
    </div>
  </div>
  <div class="chat-input">
    <textarea id="input" rows="1" placeholder="输入消息..."></textarea>
    <button id="sendBtn" onclick="send()">SEND</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  let welcomeRemoved = false;

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function removeWelcome() {
    if (!welcomeRemoved) {
      const w = messagesEl.querySelector('.welcome');
      if (w) w.remove();
      welcomeRemoved = true;
    }
  }

  function addMessage(text, role) {
    removeWelcome();
    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;
    wrapper.innerHTML = `
      <div class="label">${role === 'user' ? 'YOU' : 'AI'}</div>
      <div class="bubble"></div>
    `;
    wrapper.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    statusEl.textContent = 'GENERATING...';
    statusEl.style.color = 'var(--accent)';

    const aiMessage = addMessage('', 'ai');
    const bubble = aiMessage.querySelector('.bubble');
    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    bubble.appendChild(cursor);

    try {
      const url = `/agent/chat/stream?message=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith('data:')) {
            const chunk = line.substring(5);
            if (chunk) {
              fullText += chunk;
              bubble.textContent = fullText;
              bubble.appendChild(cursor);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        }
      }

      if (buffer.startsWith('data:')) {
        const chunk = buffer.substring(5);
        if (chunk) {
          fullText += chunk;
          bubble.textContent = fullText;
        }
      }

      if (!fullText) bubble.textContent = '(empty)';
      cursor.remove();

    } catch (err) {
      bubble.textContent = 'ERROR: ' + err.message;
      bubble.style.color = 'var(--danger)';
      cursor.remove();
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = 'READY';
      statusEl.style.color = 'var(--text-dim)';
      inputEl.focus();
    }
  }
</script>

</body>
</html>
