<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #111114;
      --surface-2: #18181c;
      --border: #222228;
      --text: #c8c8d0;
      --text-dim: #5a5a6a;
      --accent: #00e676;
      --accent-dim: #00e67620;
      --user-bg: #1a1a22;
      --danger: #ff5252;
      --sidebar-bg: #0e0e11;
      --sidebar-hover: #1a1a22;
      --sidebar-active: #1a1a2a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    .app {
      width: 960px;
      height: 92vh;
      display: flex;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .sidebar-header button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .sidebar-header button:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conversation-list::-webkit-scrollbar { width: 3px; }
    .conversation-list::-webkit-scrollbar-track { background: transparent; }
    .conversation-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .conv-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .conv-item:hover {
      background: var(--sidebar-hover);
      border-color: var(--border);
    }

    .conv-item.active {
      background: var(--sidebar-active);
      border-color: var(--accent);
    }

    .conv-item .conv-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-item.active .conv-title {
      color: var(--accent);
    }

    .conv-item .conv-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ========== 主聊天区 ========== */
    .chat-container {
      flex: 1;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .chat-header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .chat-header .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-header .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }

    .chat-header .status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; }
    .message.ai { align-self: flex-start; }

    .message .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 3px;
      padding: 0 2px;
    }

    .message.user .label {
      color: var(--accent);
      text-align: right;
    }

    .message.ai .label {
      color: var(--text-dim);
    }

    .message .bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
      color: var(--text);
    }

    .message.ai .bubble {
      background: transparent;
      border-left: 2px solid var(--accent);
      border-radius: 0;
      color: var(--text);
      padding-left: 16px;
    }

    /* Markdown 样式 */
    .message.ai .bubble h1,
    .message.ai .bubble h2,
    .message.ai .bubble h3 {
      margin-top: 8px;
      margin-bottom: 4px;
      font-weight: 600;
      color: var(--accent);
    }

    .message.ai .bubble h1 { font-size: 18px; }
    .message.ai .bubble h2 { font-size: 16px; }
    .message.ai .bubble h3 { font-size: 14px; }

    .message.ai .bubble p {
      margin-bottom: 0;
      line-height: 1.7;
    }

    .message.ai .bubble ul,
    .message.ai .bubble ol {
      margin: 4px 0;
      padding-left: 24px;
      list-style-position: outside;
    }

    .message.ai .bubble ul { list-style-type: disc; }
    .message.ai .bubble ol { list-style-type: decimal; }

    .message.ai .bubble li {
      margin-bottom: 3px;
      line-height: 1.6;
      display: list-item;
    }

    .message.ai .bubble li::marker { color: var(--accent); }
    .message.ai .bubble strong { color: var(--accent); font-weight: 600; }
    .message.ai .bubble em { color: #a0a0b0; font-style: italic; }

    .message.ai .bubble code {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #e0e0e0;
    }

    .message.ai .bubble pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin: 4px 0;
      overflow-x: auto;
    }

    .message.ai .bubble pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.ai .bubble blockquote {
      border-left: 3px solid var(--text-dim);
      padding-left: 12px;
      margin: 4px 0;
      color: var(--text-dim);
    }

    .message.ai .bubble table {
      border-collapse: collapse;
      margin: 4px 0;
      width: 100%;
    }

    .message.ai .bubble th,
    .message.ai .bubble td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .message.ai .bubble th {
      background: var(--surface-2);
      font-weight: 600;
    }

    .message.ai .bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
    }

    .cursor-blink {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .chat-input {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .chat-input textarea {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      transition: border-color 0.2s;
    }

    .chat-input textarea::placeholder {
      color: var(--text-dim);
      font-size: 13px;
    }

    .chat-input textarea:focus {
      border-color: var(--accent);
    }

    .chat-input button {
      padding: 12px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chat-input button:hover {
      background: #33eb91;
      box-shadow: 0 0 16px var(--accent-dim);
    }

    .chat-input button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      user-select: none;
    }

    .welcome .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .welcome .sub {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .welcome .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 24px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .welcome .hint kbd {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      font-size: 11px;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-dim);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="logo">>_</span>
      <button onclick="createConversation()" title="新建会话">+</button>
    </div>
    <div class="conversation-list" id="convList"></div>
  </div>

  <!-- 聊天区 -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="left">
        <span class="dot"></span>
        <span class="title" id="convTitle">Terminal</span>
      </div>
      <span class="status" id="status">READY</span>
    </div>
    <div class="chat-messages" id="messages">
      <div class="welcome">
        <div class="logo">> _</div>
        <div class="sub">AI Terminal v1.0</div>
        <div class="hint"><kbd>Enter</kbd> 发送 &nbsp; <kbd>Shift+Enter</kbd> 换行</div>
      </div>
    </div>
    <div class="chat-input">
      <textarea id="input" rows="1" placeholder="输入消息..."></textarea>
      <button id="sendBtn" onclick="send()">SEND</button>
    </div>
  </div>
</div>

<script>
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: true,
    gfm: true
  });

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const convListEl = document.getElementById('convList');
  const convTitleEl = document.getElementById('convTitle');

  let currentConvId = null;
  let conversations = [];

  // ========== 会话管理 ==========

  async function loadConversations() {
    try {
      const res = await fetch('/agent/conversation/list');
      const data = await res.json();
      if (data.code === 1) {
        conversations = data.data || [];
        renderConvList();
      }
    } catch (e) {
      console.error('加载会话列表失败:', e);
    }
  }

  function renderConvList() {
    if (conversations.length === 0) {
      convListEl.innerHTML = '<div class="empty-state">暂无会话</div>';
      return;
    }
    convListEl.innerHTML = conversations.map(c => `
      <div class="conv-item ${c.id === currentConvId ? 'active' : ''}"
           onclick="switchConversation(${c.id})">
        <div class="conv-title">${escapeHtml(c.title)}</div>
        <div class="conv-time">${formatTime(c.updatedAt)}</div>
      </div>
    `).join('');
  }

  async function createConversation() {
    try {
      const res = await fetch('/agent/conversation?title=新对话', { method: 'POST' });
      const data = await res.json();
      if (data.code === 1) {
        await loadConversations();
        switchConversation(data.data.id);
      }
    } catch (e) {
      console.error('创建会话失败:', e);
    }
  }

  async function switchConversation(id) {
    currentConvId = id;
    const conv = conversations.find(c => c.id === id);
    convTitleEl.textContent = conv ? conv.title : 'Terminal';
    renderConvList();
    await loadHistory(id);
  }

  async function loadHistory(convId) {
    messagesEl.innerHTML = '';
    try {
      const res = await fetch(`/agent/conversation/${convId}/messages`);
      const data = await res.json();
      if (data.code === 1 && data.data && data.data.length > 0) {
        for (const msg of data.data) {
          if (msg.role === 'USER') {
            addMessage(msg.content, 'user');
          } else if (msg.role === 'ASSISTANT') {
            addMessage(msg.content, 'ai');
          }
        }
      } else {
        showWelcome();
      }
    } catch (e) {
      console.error('加载历史失败:', e);
      showWelcome();
    }
  }

  async function generateTitle(convId) {
    const conv = conversations.find(c => c.id === convId);
    if (!conv || conv.title !== '新对话') return;
    try {
      const res = await fetch(`/agent/conversation/${convId}/generate-title`, { method: 'POST' });
      const data = await res.json();
      if (data.code === 1 && data.data) {
        convTitleEl.textContent = data.data;
        await loadConversations();
      }
    } catch (e) {
      console.error('生成标题失败:', e);
    }
  }

  function showWelcome() {
    messagesEl.innerHTML = `
      <div class="welcome">
        <div class="logo">> _</div>
        <div class="sub">AI Terminal v1.0</div>
        <div class="hint"><kbd>Enter</kbd> 发送 &nbsp; <kbd>Shift+Enter</kbd> 换行</div>
      </div>
    `;
  }

  // ========== 聊天 ==========

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function renderMarkdown(text) {
    return marked.parse(text);
  }

  function addMessage(text, role) {
    // 移除欢迎页
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;
    wrapper.innerHTML = `
      <div class="label">${role === 'user' ? 'YOU' : 'AI'}</div>
      <div class="bubble"></div>
    `;
    const bubble = wrapper.querySelector('.bubble');
    if (role === 'user') {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = renderMarkdown(text);
    }
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    // 没有当前会话时自动创建
    if (!currentConvId) {
      try {
        const res = await fetch('/agent/conversation?title=新对话', { method: 'POST' });
        const data = await res.json();
        if (data.code === 1) {
          currentConvId = data.data.id;
          await loadConversations();
          convTitleEl.textContent = data.data.title;
        }
      } catch (e) {
        console.error('自动创建会话失败:', e);
        return;
      }
    }

    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    statusEl.textContent = 'GENERATING...';
    statusEl.style.color = 'var(--accent)';

    const aiMessage = addMessage('', 'ai');
    const bubble = aiMessage.querySelector('.bubble');
    bubble.innerHTML = '<span class="cursor-blink"></span>';

    try {
      const url = `/agent/chat/stream?conversationId=${currentConvId}&message=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';
      let lastRenderTime = 0;

      // 流式渲染：markdown 解析 + 光标
      function renderStreaming(text) {
        bubble.innerHTML = '';
        const container = document.createElement('div');
        container.innerHTML = renderMarkdown(text);
        bubble.appendChild(container);
        const cursor = document.createElement('span');
        cursor.className = 'cursor-blink';
        bubble.appendChild(cursor);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // 节流：30ms 内只渲染一次
      function throttledRender(text) {
        const now = Date.now();
        if (now - lastRenderTime < 30) return;
        lastRenderTime = now;
        renderStreaming(text);
      }

      // 解析 SSE 事件，保留数据内部换行
      function processEvents(raw) {
        const events = raw.split(/\n\n/);
        const incomplete = events.pop(); // 保留未完成的部分
        let content = '';
        for (const event of events) {
          if (!event.trim()) continue;
          const lines = event.split(/\n/);
          for (const line of lines) {
            if (line.startsWith('data:')) {
              if (content) content += '\n';
              content += line.substring(5);
            }
          }
        }
        return { content, incomplete: incomplete || '' };
      }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const result = processEvents(buffer);
        buffer = result.incomplete;
        if (result.content) {
          fullText += result.content;
          throttledRender(fullText);
        }
      }

      // 处理缓冲区剩余
      if (buffer.trim()) {
        const lines = buffer.split(/\n/);
        for (const line of lines) {
          if (line.startsWith('data:')) {
            fullText += line.substring(5);
          }
        }
      }

      // 流结束后最终渲染（完整 markdown）
      if (fullText) {
        bubble.innerHTML = renderMarkdown(fullText);
      } else {
        bubble.textContent = '(empty)';
      }

      // 刷新会话列表（updatedAt 会变）
      loadConversations();

      // 自动生成会话标题
      generateTitle(currentConvId);

    } catch (err) {
      bubble.textContent = 'ERROR: ' + err.message;
      bubble.style.color = 'var(--danger)';
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = 'READY';
      statusEl.style.color = 'var(--text-dim)';
      inputEl.focus();
    }
  }

  // ========== 工具函数 ==========

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    if (isToday) {
      return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
  }

  // ========== 初始化 ==========

  loadConversations();
</script>

</body>
</html>
