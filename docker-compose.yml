# 仅部署应用，数据库和 Redis 使用服务器上已有的容器
services:
  app:
    build: .
    network_mode: host
    environment:
      - DB_URL=jdbc:postgresql://127.0.0.1:5432/${DB_NAME:-postgres}
      - DB_USERNAME=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - DASHSCOPE_MCP_URL=${DASHSCOPE_MCP_URL:-}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - WEBFETCH_PROXY_HOST=${WEBFETCH_PROXY_HOST:-}
      - WEBFETCH_PROXY_PORT=${WEBFETCH_PROXY_PORT:-0}
    restart: unless-stopped
